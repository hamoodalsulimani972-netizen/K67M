<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K67M — حالة الطلب</title><link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--g:#ffd15c;--m:#a39d95;--l:#2c2830}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(800px 500px at 50% 0,#f4b4001f,transparent 65%),#0b0b0c;color:#f5efe2;font-family:'Noto Naskh Arabic',serif;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:min(500px,100%);background:#17151b;border:1px solid var(--l);border-radius:22px;padding:35px;text-align:center}.logo{width:105px;height:105px;border-radius:50%;object-fit:cover;border:2px solid #f4b400}h1{color:var(--g)}#s{font-size:24px;font-weight:700}.pending{color:#ffd15c}.approved{color:#35c46a}.rejected{color:#c8102e}.d{color:var(--m);line-height:1.9}.logout{margin-top:18px;background:transparent;color:var(--m);border:1px solid var(--l);padding:10px 18px;border-radius:10px;font-family:inherit}</style></head><body><main class="card"><img class="logo" src="logo.jpg"><h1>K67M</h1><div id="s">جاري التحميل...</div><p id="d" class="d"></p><button class="logout" onclick="logout()">تسجيل الخروج</button></main><script>async function load(){const r=await fetch('/api/me');if(!r.ok){location='/';return}const x=await r.json(),s=x.application?.status||'pending',e=document.getElementById('s'),d=document.getElementById('d');if(s==='approved'){e.className='approved';e.textContent='✅ تم قبولك';d.textContent='تم إعطاؤك رتبة Member، وإذا كانت صلاحيات السيرفر مضبوطة على الرتبة فستظهر لك قنوات الأعضاء.'}else if(s==='rejected'){e.className='rejected';e.textContent='❌ تم رفض الطلب';d.textContent='تواصل مع الإدارة إذا أردت الاستفسار.'}else{e.className='pending';e.textContent='⏳ بانتظار موافقة الإدارة';d.textContent='تم إنشاء تذكرة خاصة بك في Discord. انتظر موافقة الإدارة.';setTimeout(load,5000)}}async function logout(){await fetch('/logout',{method:'POST'});location='/' }load();</script></body></html>
